# Мониторинг живого сайта после деплоя.
# Скопируйте в .github/workflows/legitagent-watch.yml.
# Задайте vars.LEGITAGENT_WATCH_URL или передайте url при workflow_dispatch.
# Telegram secrets опциональны — если LEGITAGENT_TELEGRAM_BOT_TOKEN и LEGITAGENT_TELEGRAM_CHAT_ID
# заданы в env шага, action отправит summary в Telegram.
name: legitAgent watch

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL для проверки (иначе vars.LEGITAGENT_WATCH_URL)
        required: false
        type: string
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kiruxich/legitAgent/.github/actions/legitagent-scan@v0.7.0
        with:
          url: ${{ github.event.inputs.url || vars.LEGITAGENT_WATCH_URL }}
          fail-on-high: true
        env:
          LEGITAGENT_TELEGRAM_BOT_TOKEN: ${{ secrets.LEGITAGENT_TELEGRAM_BOT_TOKEN }}
          LEGITAGENT_TELEGRAM_CHAT_ID: ${{ secrets.LEGITAGENT_TELEGRAM_CHAT_ID }}
          LEGITAGENT_LLM_API_KEY: ${{ secrets.LEGITAGENT_LLM_API_KEY }}
