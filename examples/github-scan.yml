# Скопируйте в .github/workflows/legitagent.yml своего сайта.
# Код выхода 1 — есть находка high, PR не сойдётся.
name: legitAgent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Changed source files
        id: changed
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          LEGITAGENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LEGITAGENT_HEAD_SHA: ${{ github.sha }}
        run: |
          files="$(git diff --name-only --diff-filter=ACMR "$LEGITAGENT_BASE_SHA" "$LEGITAGENT_HEAD_SHA" | grep -E '\.(html|js|jsx|ts|tsx|mjs|cjs|vue|svelte|astro)$' | paste -sd, - || true)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - uses: kiruxich/legitAgent/.github/actions/legitagent-scan@v0.8.0
        with:
          root: .
          fail-on-high: true
          changed-files: ${{ steps.changed.outputs.files }}
          fail-on-confidence: medium
