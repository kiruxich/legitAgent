# Скопируйте в .github/workflows/legitagent.yml своего сайта.
# Код выхода 1 — есть находка high, PR не сойдётся.
name: legitAgent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kiruxich/legitAgent/.github/actions/legitagent-scan@main
        with:
          root: .
          fail-on-high: true
