id: zozpp18
law: ЗоЗПП
article: ст. 18
text: Потребитель вправе предъявить требования, установленные законом, если недостатки товара были обнаружены в течение гарантийного срока. Продавец, изготовитель обязаны принять товар у потребителя и удовлетворить его требования, если не докажут иное.
