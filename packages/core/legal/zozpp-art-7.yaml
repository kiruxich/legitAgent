id: zozpp7
law: ЗоЗПП
article: ст. 7
text: Изготовитель обязан довести до сведения потребителя наименование своего предприятия и его местонахождение. Торговые предприятия обязаны иметь вывеску с указанием фирменного наименования и юридический адрес.
