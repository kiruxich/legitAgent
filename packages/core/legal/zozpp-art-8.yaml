id: zozpp8
law: ЗоЗПП
article: ст. 8
text: Изготовитель (исполнитель, продавец) обязан своевременно предоставлять потребителю необходимую и достоверную информацию о товарах (работах, услугах), обеспечивающую возможность их компетентного выбора. Информация в обязательном порядке должна содержать цену и условия приобретения.
