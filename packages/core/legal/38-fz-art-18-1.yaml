id: adv18-1
law: 38-ФЗ
article: ст. 18.1
text: Интернет-реклама должна содержать пометку «реклама», сведения о рекламодателе или его сайте, а также присвоенный оператором рекламных данных идентификатор рекламы в предусмотренных законом случаях.
