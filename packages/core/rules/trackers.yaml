- id: PDN.TRACKER.NO_CONSENT
  law: 152-ФЗ ст. 6
  severity: high
  status: active
  title: Метрика или пиксель без согласия
  titleEn: Analytics or pixel without consent
  message: Аналитика или рекламный пиксель инициализируются сразу, без проверки согласия.
  messageEn: Analytics or an ad pixel starts immediately, without checking consent.
  fix: Вызывайте ym/gtag/fbq только после opt-in в cookie-баннере.
  fixEn: Call ym/gtag/fbq only after cookie-banner opt-in.
  excerptRef: art6
- id: PDN.COOKIE.BEFORE_CONSENT
  law: 152-ФЗ ст. 6
  severity: high
  status: active
  title: Cookie до согласия
  titleEn: Cookies before consent
  message: Аналитические cookie не должны ставиться до opt-in. Нужна проверка живого сайта.
  messageEn: Analytics cookies must not be set before opt-in. Check the live site.
  fix: Не загружайте трекеры до клика «Принять». Проверьте живой сайт командой scan-url.
  fixEn: Do not load trackers before Accept. Verify with scan-url.
  excerptRef: art6
- id: PDN.COOKIE.NO_REJECT
  law: 152-ФЗ ст. 9
  severity: medium
  status: active
  title: Баннер без отказа
  titleEn: Banner without a reject option
  message: У пользователя должна быть реальная возможность отклонить необязательные cookie.
  messageEn: The user must be able to reject non-essential cookies.
  fix: Добавьте кнопку отказа, не только «Принять».
  fixEn: Add a reject button, not only Accept.
  excerptRef: art9
- id: PDN.TRANSFER.FOREIGN_TRACKER
  law: 152-ФЗ ст. 6
  severity: medium
  status: active
  title: Иностранный трекер / трансграничная передача
  titleEn: Foreign tracker / cross-border transfer
  message: Google Analytics, Meta Pixel и аналогичные сервисы могут означать трансграничную передачу ПДн.
  messageEn: Google Analytics, Meta Pixel and similar services may mean a cross-border transfer of personal data.
  fix: Задокументируйте передачу или замените на российский аналог.
  fixEn: Document the transfer or switch to a Russian analogue.
  excerptRef: art6
