- id: CONSUMER.OFFER.MISSING
  law: ЗоЗПП ст. 26.1
  severity: medium
  status: active
  kind: risk
  confidence: low
  title: Не найдены условия дистанционной продажи
  titleEn: Distance-selling terms not found
  message: Есть признаки интернет-магазина, но не найдены условия дистанционной продажи. Отдельный документ с названием «оферта» не всегда обязателен — проверьте доступность обязательной информации до заказа.
  messageEn: The project looks like a web shop, but distance-selling terms were not found. A separate document titled “offer” is not always required; verify that mandatory information is available before checkout.
  fix: Опубликуйте условия продажи, оплаты, доставки и возврата и дайте на них ссылку до оформления заказа.
  fixEn: Publish sales, payment, delivery, and return terms and link them before checkout.
  excerptRef: zozpp26-1
- id: CONSUMER.REQUISITES.MISSING
  law: ЗоЗПП ст. 9
  severity: medium
  status: active
  kind: risk
  confidence: medium
  title: Нет реквизитов продавца
  titleEn: Seller details missing
  message: Для витрины не найдены ИНН или ОГРН продавца.
  messageEn: The storefront has no seller INN or OGRN.
  fix: Укажите наименование, адрес, ИНН и ОГРН в подвале или на странице контактов.
  fixEn: Put the legal name, address, INN and OGRN in the footer or a contacts page.
  excerptRef: zozpp9
- id: CONSUMER.RETURN.MISSING
  law: ЗоЗПП ст. 26.1
  severity: medium
  status: active
  kind: risk
  confidence: medium
  title: Нет условий возврата
  titleEn: No return terms
  message: Витрина не объясняет, как вернуть или обменять товар.
  messageEn: The storefront does not explain how to return or exchange goods.
  fix: Добавьте страницу возврата и ссылку на неё.
  fixEn: Add a returns page and a link to it.
  excerptRef: zozpp26-1
