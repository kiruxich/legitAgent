- id: PDN.POLICY.NO_LINK
  law: 152-ФЗ ст. 18.1
  severity: high
  status: active
  kind: risk
  confidence: medium
  title: Нет ссылки на политику обработки ПДн
  titleEn: No personal-data policy link
  message: В проекте не найдена ссылка на политику обработки персональных данных.
  messageEn: The project has no link to a personal-data processing policy.
  fix: Добавьте в футер или шапку ссылку на HTML-страницу политики (например /privacy).
  fixEn: Add a footer or header link to a policy page (for example /privacy).
  excerptRef: art18-1
- id: PDN.POLICY.INCOMPLETE
  law: 152-ФЗ ст. 18.1
  severity: medium
  status: active
  kind: risk
  confidence: low
  title: Политика без обязательных сведений
  titleEn: Policy is missing required details
  message: "В тексте политики не найдены некоторые сведения, обычно необходимые для прозрачного описания обработки: оператор, цели, категории данных, сроки или порядок прекращения обработки. Нужна ручная проверка документа."
  messageEn: "The policy text appears to omit information normally needed for a transparent processing description: operator, purposes, data categories, retention, or termination procedure. Manual review is required."
  fix: Проверьте содержание политики по ст. 18.1 и рекомендациям Роскомнадзора; подтвердите итоговый текст с юристом.
  fixEn: Review the policy against article 18.1 and Roskomnadzor guidance; have counsel confirm the final text.
  excerptRef: art18-1
