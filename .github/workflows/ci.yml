name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/generate-catalog.mjs
      - name: Catalog docs match the YAML source
        run: git diff --exit-code docs/RULES.md website/rules.html
      - name: Install Playwright Chromium
        run: pnpm --filter @legit-agent/live exec playwright install --with-deps chromium
      - run: pnpm -r test
