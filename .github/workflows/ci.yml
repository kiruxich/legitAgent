name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm release:check
      - run: node scripts/generate-catalog.mjs
      - name: Catalog docs match the YAML source
        run: git diff --exit-code docs/RULES.md website/rules.html
      - name: Detector precision/recall benchmark
        run: pnpm benchmark
      - name: Legal catalog metadata and snapshot integrity
        run: pnpm legal:check
      - name: Install Playwright Chromium
        run: pnpm --filter @legit-agent/live exec playwright install --with-deps chromium
      - run: pnpm -r test
