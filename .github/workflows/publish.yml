# Publishes @legit-agent/{core,cli,mcp} via npm Trusted Publishing (OIDC).
# No NPM_TOKEN. Trigger: git tag v* after bumping package versions.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with OIDC support
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

      - name: Pack workspace packages
        run: |
          pnpm --filter @legit-agent/core pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter @legit-agent/cli pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter @legit-agent/mcp pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm
        run: |
          npm publish "$RUNNER_TEMP"/legit-agent-core-*.tgz --access public
          npm publish "$RUNNER_TEMP"/legit-agent-cli-*.tgz --access public
          npm publish "$RUNNER_TEMP"/legit-agent-mcp-*.tgz --access public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
