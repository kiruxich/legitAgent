# Publishes @legit-agent/{core,live,cli,mcp} via npm Trusted Publishing (OIDC).
# No NPM_TOKEN. Trigger: git tag v* after bumping package versions.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with OIDC support
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Install Playwright Chromium
        run: pnpm --filter @legit-agent/live exec playwright install --with-deps chromium
      - run: pnpm -r test

      - name: Pack workspace packages
        run: |
          pnpm -C packages/core pack --pack-destination "$RUNNER_TEMP"
          pnpm -C packages/live pack --pack-destination "$RUNNER_TEMP"
          pnpm -C packages/cli pack --pack-destination "$RUNNER_TEMP"
          pnpm -C packages/mcp pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm
        run: |
          publish_tgz() {
            local tgz="$1"
            if npm publish "$tgz" --access public; then
              return 0
            fi
            local spec
            spec="$(tar -xOf "$tgz" package/package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);console.log(p.name+'@'+p.version)})")"
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "Already on npm, skipping $spec"
              return 0
            fi
            return 1
          }
          publish_tgz "$RUNNER_TEMP"/legit-agent-core-*.tgz
          publish_tgz "$RUNNER_TEMP"/legit-agent-live-*.tgz
          publish_tgz "$RUNNER_TEMP"/legit-agent-cli-*.tgz
          publish_tgz "$RUNNER_TEMP"/legit-agent-mcp-*.tgz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
