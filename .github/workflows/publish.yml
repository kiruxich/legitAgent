# Publishes @legit-agent/{core,live,cli,mcp} via npm Trusted Publishing (OIDC).
# No NPM_TOKEN. Trigger: git tag v* after bumping package versions.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm Trusted Publishing prerequisites
        run: |
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error('Trusted Publishing requires Node >=22.14.0');"
          npm_version="$(npm --version)"
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('Trusted Publishing requires npm >=11.5.1');" "$npm_version"

      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
        env:
          LEGITAGENT_REQUIRE_RELEASE_TAG: 'true'
      - run: pnpm -r build
      - name: Install Playwright Chromium
        run: pnpm --filter @legit-agent/live exec playwright install --with-deps chromium
      - run: pnpm -r test

      - name: Pack workspace packages
        run: |
          mkdir -p "$RUNNER_TEMP/legitagent-release"
          pnpm -C packages/core pack --pack-destination "$RUNNER_TEMP/legitagent-release"
          pnpm -C packages/live pack --pack-destination "$RUNNER_TEMP/legitagent-release"
          pnpm -C packages/cli pack --pack-destination "$RUNNER_TEMP/legitagent-release"
          pnpm -C packages/mcp pack --pack-destination "$RUNNER_TEMP/legitagent-release"

      - name: Verify packed package manifests
        run: pnpm release:check
        env:
          LEGITAGENT_REQUIRE_RELEASE_TAG: 'true'
          LEGITAGENT_PACK_DIR: ${{ runner.temp }}/legitagent-release

      - name: Generate repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ runner.temp }}/legitagent-release
          format: spdx-json
          output-file: ${{ runner.temp }}/legitagent.spdx.json
          artifact-name: legitagent-sbom
          syft-version: v1.51.0
          upload-release-assets: false

      - name: Attest package provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/legitagent-release/legit-agent-*.tgz

      - name: Publish to npm
        run: |
          publish_tgz() {
            local tgz="$1"
            if npm publish "$tgz" --access public --provenance; then
              return 0
            fi
            local spec
            spec="$(tar -xOf "$tgz" package/package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);console.log(p.name+'@'+p.version)})")"
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "Already on npm, skipping $spec"
              return 0
            fi
            return 1
          }
          publish_tgz "$RUNNER_TEMP"/legitagent-release/legit-agent-core-*.tgz
          publish_tgz "$RUNNER_TEMP"/legitagent-release/legit-agent-live-*.tgz
          publish_tgz "$RUNNER_TEMP"/legitagent-release/legit-agent-cli-*.tgz
          publish_tgz "$RUNNER_TEMP"/legitagent-release/legit-agent-mcp-*.tgz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/legitagent-release/legit-agent-*.tgz
            ${{ runner.temp }}/legitagent.spdx.json
