name: legitAgent scan
description: Scan the repository for typical 152-FZ risks, write SARIF, and upload it to GitHub code scanning
inputs:
  root:
    description: Project root to scan
    required: false
    default: '.'
  fail-on-high:
    description: Fail the job when the CLI reports a high finding (exit 1)
    required: false
    default: 'true'
  comment-on-pr:
    description: Post or update a PR comment with scan results
    required: false
    default: 'true'
  create-issue-on-high:
    description: Create or update an issue when high findings are detected on non-PR events
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Scan
      id: scan
      shell: bash
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      run: |
        set +e
        npx --yes @legit-agent/cli@0.6.0 scan "${{ inputs.root }}" --sarif legitagent.sarif
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: legitagent.sarif
    - name: Comment on PR
      if: github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('legitagent.sarif')) return;
          const sarif = JSON.parse(fs.readFileSync('legitagent.sarif', 'utf8'));
          const { formatReport } = await import('${{ github.action_path }}/format-report.mjs');
          const body = formatReport(sarif);
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body && c.body.includes('<!-- legitagent-scan -->'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
    - name: Create or update issue on high
      if: github.event_name != 'pull_request' && inputs.create-issue-on-high == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('legitagent.sarif')) return;
          const sarif = JSON.parse(fs.readFileSync('legitagent.sarif', 'utf8'));
          const { formatReport, countHigh } = await import('${{ github.action_path }}/format-report.mjs');
          if (countHigh(sarif) === 0) return;
          const body = formatReport(sarif);
          const title = 'legitAgent: находки high';
          const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
            q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
          });
          const existing = searchResult.items.find((i) => i.title === title);
          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
            });
          } else {
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['legitagent'],
              });
            } catch (e) {
              if (e.status === 422) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              } else {
                throw e;
              }
            }
          }
    - name: Fail on high findings
      if: ${{ steps.scan.outputs.exit_code != '0' && (inputs.fail-on-high == 'true' || steps.scan.outputs.exit_code != '1') }}
      shell: bash
      run: exit ${{ steps.scan.outputs.exit_code }}
