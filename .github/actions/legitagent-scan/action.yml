name: legitAgent scan
description: Scan the repository for typical 152-FZ risks, write SARIF, and upload it to GitHub code scanning
inputs:
  root:
    description: Project root to scan
    required: false
    default: '.'
  url:
    description: Live URL to scan instead of source (scan-url mode)
    required: false
    default: ''
  evidence-dir:
    description: Directory for evidence pack when url is set
    required: false
    default: 'legitagent-evidence'
  fail-on-high:
    description: Fail the job when the CLI reports a high finding (exit 1)
    required: false
    default: 'true'
  comment-on-pr:
    description: Post or update a PR comment with scan results
    required: false
    default: 'true'
  create-issue-on-high:
    description: Create or update an issue when high findings are detected on non-PR events
    required: false
    default: 'true'
  baseline:
    description: Optional baseline file; matching existing findings are not reported
    required: false
    default: ''
  changed-files:
    description: Optional comma-separated files to scan
    required: false
    default: ''
  fail-on-confidence:
    description: Minimum confidence that may fail a high-severity scan (high, medium, or low)
    required: false
    default: 'low'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
    - name: Scan
      id: scan
      shell: bash
      env:
        LEGITAGENT_ROOT: ${{ inputs.root }}
        LEGITAGENT_URL: ${{ inputs.url }}
        LEGITAGENT_EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        LEGITAGENT_BASELINE: ${{ inputs.baseline }}
        LEGITAGENT_CHANGED_FILES: ${{ inputs.changed-files }}
        LEGITAGENT_FAIL_ON_CONFIDENCE: ${{ inputs.fail-on-confidence }}
        LEGITAGENT_TELEGRAM_BOT_TOKEN: ${{ env.LEGITAGENT_TELEGRAM_BOT_TOKEN }}
        LEGITAGENT_TELEGRAM_CHAT_ID: ${{ env.LEGITAGENT_TELEGRAM_CHAT_ID }}
        LEGITAGENT_OPENROUTER_API_KEY: ${{ env.LEGITAGENT_OPENROUTER_API_KEY }}
        LEGITAGENT_LLM_MODEL: ${{ env.LEGITAGENT_LLM_MODEL }}
      run: |
        set +e
        rm -f legitagent.sarif || exit 3
        if [ -n "$LEGITAGENT_URL" ]; then
          NOTIFY_ARGS=()
          if [ -n "$LEGITAGENT_TELEGRAM_BOT_TOKEN" ] && [ -n "$LEGITAGENT_TELEGRAM_CHAT_ID" ]; then
            NOTIFY_ARGS+=(--notify-telegram)
          fi
          npx --yes playwright@1.62.1 install --with-deps chromium || exit 3
          npx --yes @legit-agent/cli@1.1.1 scan-url "$LEGITAGENT_URL" \
            --evidence "$LEGITAGENT_EVIDENCE_DIR" \
            --review \
            --sarif legitagent.sarif \
            --fail-on-confidence "$LEGITAGENT_FAIL_ON_CONFIDENCE" \
            "${NOTIFY_ARGS[@]}"
          code=$?
        else
          EXTRA_ARGS=()
          if [ -n "$LEGITAGENT_BASELINE" ]; then
            EXTRA_ARGS+=(--baseline "$LEGITAGENT_BASELINE")
          fi
          if [ -n "$LEGITAGENT_CHANGED_FILES" ]; then
            EXTRA_ARGS+=(--changed-files "$LEGITAGENT_CHANGED_FILES")
          fi
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npx --yes @legit-agent/cli@1.1.1 scan "$LEGITAGENT_ROOT" \
            --sarif legitagent.sarif \
            --fail-on-confidence "$LEGITAGENT_FAIL_ON_CONFIDENCE" \
            "${EXTRA_ARGS[@]}"
          code=$?
        fi
        if [ "$code" -eq 0 ] || [ "$code" -eq 1 ]; then
          node -e "const fs = require('node:fs'); const report = JSON.parse(fs.readFileSync('legitagent.sarif', 'utf8')); if (report.version !== '2.1.0' || !Array.isArray(report.runs?.[0]?.results)) process.exit(1);" || code=3
        fi
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
      continue-on-error: true
      with:
        sarif_file: legitagent.sarif
    - name: Comment on PR
      if: github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        LEGITAGENT_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('legitagent.sarif')) return;
          const sarif = JSON.parse(fs.readFileSync('legitagent.sarif', 'utf8'));
          const { pathToFileURL } = require('node:url');
          const { formatReport } = await import(pathToFileURL(require('node:path').join(process.env.LEGITAGENT_ACTION_PATH, 'format-report.mjs')).href);
          const body = formatReport(sarif);
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body && c.body.includes('<!-- legitagent-scan -->'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
    - name: Create or update issue on high
      if: github.event_name != 'pull_request' && inputs.create-issue-on-high == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        LEGITAGENT_ACTION_PATH: ${{ github.action_path }}
        LEGITAGENT_FAIL_ON_CONFIDENCE: ${{ inputs.fail-on-confidence }}
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('legitagent.sarif')) return;
          const sarif = JSON.parse(fs.readFileSync('legitagent.sarif', 'utf8'));
          const { pathToFileURL } = require('node:url');
          const { formatReport, countHigh } = await import(pathToFileURL(require('node:path').join(process.env.LEGITAGENT_ACTION_PATH, 'format-report.mjs')).href);
          if (countHigh(sarif, process.env.LEGITAGENT_FAIL_ON_CONFIDENCE) === 0) return;
          const body = formatReport(sarif);
          const title = 'legitAgent: находки high';
          const { data: searchResult } = await github.rest.search.issuesAndPullRequests({
            q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
          });
          const existing = searchResult.items.find((i) => i.title === title);
          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body,
            });
          } else {
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['legitagent'],
              });
            } catch (e) {
              if (e.status === 422) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              } else {
                throw e;
              }
            }
          }
    - name: Enforce scan result
      if: always() && steps.scan.outcome == 'success'
      shell: bash
      env:
        LEGITAGENT_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        LEGITAGENT_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
      run: |
        if [ "$LEGITAGENT_EXIT_CODE" = '0' ]; then
          exit 0
        fi
        if [ "$LEGITAGENT_EXIT_CODE" = '1' ] && [ "$LEGITAGENT_FAIL_ON_HIGH" = 'false' ]; then
          exit 0
        fi
        exit "${LEGITAGENT_EXIT_CODE:-3}"
